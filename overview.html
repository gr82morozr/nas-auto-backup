<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f6f6; color: #173438; font: 1rem/1.55 "Segoe UI", sans-serif; }
    main { width: min(60rem, 90%); margin: 3rem auto; }
    nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    a { color: #195e60; text-underline-offset: 4px; }
    nav a:last-child { border: 1px solid #9fb8b8; padding: .35rem 1rem; border-radius: .5rem; text-decoration: none; }
    h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); letter-spacing: -.04em; margin: 2rem 0 1.2rem; }
    section { background: white; padding: clamp(1.3rem, 4vw, 2.5rem); border: 1px solid #d3dede; border-top: 4px solid #237874; border-radius: .65rem; }
    h2 { margin: 0 0 .5rem; font-size: 1.3rem; }
    p { margin: 0; color: #476469; }
    section { margin: 1rem 0; }
    form,.actions,.queue { display:flex; flex-wrap:wrap; align-items:center; gap:.7rem; }
    input,button { font:inherit; padding:.5rem .8rem; border-radius:.4rem; border:1px solid #8fa7a6; }
    input { max-width:100%; }
    button { cursor:pointer; background:white; color:#155956; }
    button[type=submit] { background:#155956; color:white; }
    button:disabled { opacity:.55; cursor:default; }
    progress { width:100%; accent-color:#237874; }
    .queue a { padding:.3em .6em; background:#edf5f4; border-radius:.25em; }
    table { border-collapse:collapse; width:100%; } th,td { text-align:left; border-bottom:1px solid #d2dfdd; padding:.65em; }
    .scroll { overflow:auto; } #current { overflow-wrap:anywhere; font-weight:600; }
  </style>
</head>
<body>
  <main>
    <nav aria-label="App navigation">
      <a href="/nas-gateway/output/">← NAS Gateway</a>
      <a href="/auto-backup/control/settings">Settings</a>
    </nav>
    <h1>{{title}}</h1>
    <section aria-labelledby="activity">
      <h2 id="activity">Backup activity</h2>
      <form id="request"><label for="folder">Source subfolder</label>
        <input id="folder" value="." required title="Relative to the configured source root">
        <button type="submit">Start backup</button><button id="audit" type="button">Check archive now</button>
      </form>
      <p id="message" role="status"></p>
    </section>
    <section><h2 id="job">Current job</h2><p id="current">Loading progress…</p>
      <progress id="bar"></progress><p id="totals"></p><div class="queue" id="queues"></div>
      <p id="health"></p><p id="snapshot"></p>
    </section>
    <section><h2>Job queue and reports</h2><div class="scroll"><table>
      <thead><tr><th>Job</th><th>Source</th><th>Status</th><th>Requested (UTC)</th></tr></thead>
      <tbody id="jobs"></tbody></table></div><div class="actions">
      <button id="previous">Previous</button><button id="next">Next</button></div>
    </section>
  </main>
  <script>
    const base = '/auto-backup/control/';
    const el = id => document.getElementById(id);
    const active = ['queued','hashing','validating','copying','verifying','auditing','repairing'];
    let page = 0;
    function reportLink(job, label, state='') {
      const a = document.createElement('a');
      a.href = base+'report?'+new URLSearchParams({job, state});
      a.textContent = label;
      return a;
    }
    async function refresh() {
      const requested = page;
      const response = await fetch(base+'progress?page='+page,{cache:'no-store'});
      if (!response.ok) throw Error('Progress unavailable');
      const d = await response.json();
      if (page !== requested) return;
      el('job').textContent = d.job ? d.job.kind+' #'+d.job.id+' · '+d.job.state : 'Current job';
      el('current').textContent = d.file ? [d.file.state,d.file.path,d.file.progress].filter(Boolean).join(' · ') : (d.job?.error || (d.job?.state==='discovering' ? 'Discovering files in '+d.job.folder : 'No file in progress'));
      const total = Object.values(d.counts).reduce((a,b)=>a+b,0);
      const done = total-active.reduce((n,k)=>n+(d.counts[k]||0),0);
      el('bar').max = total || 1; el('bar').value = done;
      el('totals').textContent = done+' of '+total+' discovered files finished';
      el('queues').replaceChildren();
      el('health').textContent=d.damaged ? d.damaged+' archived files need repair.' : '';
      if (d.job) for (const state of new Set([...active,...Object.keys(d.counts)])) {
        el('queues').append(reportLink(d.job.id,state+' '+(d.counts[state]||0),state));
      }
      el('snapshot').textContent = 'Last database snapshot: '+(d.snapshot ? d.snapshot.at+' UTC' : 'Pending')+
        (d.maintenance?.action==='maintenance error' ? ' · '+d.maintenance.detail : '');
      el('jobs').replaceChildren();
      for (const j of d.jobs) {
        const row = el('jobs').insertRow();
        row.insertCell().append(reportLink(j.id,j.kind+' #'+j.id));
        for(const value of [j.folder,j.state,j.created]) row.insertCell().textContent=value;
      }
      el('previous').disabled = page===0; el('next').disabled = (page+1)*20>=d.job_count;
    }
    function poll() { return refresh().catch(e=>{el('current').textContent='Unable to update progress: '+e.message;}); }
    async function request(kind) {
      try {
        const r = await fetch(base+'jobs',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({kind,folder:el('folder').value})});
        const d=await r.json(); if(!r.ok) throw Error(d.error);
        el('message').textContent='Queued job #'+d.job; page=0; await poll();
      } catch(e) { el('message').textContent=e.message; }
    }
    el('request').onsubmit=e=>{e.preventDefault();request('backup');};
    el('audit').onclick=()=>request('audit');
    el('previous').onclick=()=>{page=Math.max(0,page-1);poll();};
    el('next').onclick=()=>{page++;poll();};
    poll(); setInterval(poll,3000);
  </script>
</body>
</html>
